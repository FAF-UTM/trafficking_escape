spring.application.name=backend
server.port=8080

# Trust X-Forwarded-* from the nginx reverse proxy (private network addresses only),
# so rate limiting sees the real client IP.
server.forward-headers-strategy=native

# Blocking calls (DB, OpenAI) run on virtual threads.
spring.threads.virtual.enabled=true

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Security ---
# JWT_SECRET: random string of at least 32 characters, e.g. `openssl rand -base64 48`.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=trafficking-escape
app.security.jwt.ttl=${JWT_TTL:3h}

# Session cookie (holds the JWT; HttpOnly). Secure + SameSite=Strict assume the frontend and the API
# are served from the same site (e.g. traffickingescape.com and api.traffickingescape.com, or one origin).
app.security.cookie.session-name=${COOKIE_SESSION_NAME:te_session}
app.security.cookie.csrf-name=${COOKIE_CSRF_NAME:te_csrf}
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}
app.security.cookie.domain=${COOKIE_DOMAIN:}

# Comma-separated list of frontend origins allowed by CORS (only needed when not served from one origin).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://traffickingescape.com,https://www.traffickingescape.com}

# Optional: creates this admin on startup if it does not exist yet.
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.email=${ADMIN_EMAIL:}

# --- OpenAI ---
app.openai.api-key=${OPENAI_API_KEY:${GPT_TOKEN:}}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.openai.model=${OPENAI_MODEL:gpt-6-luna}
app.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
app.openai.max-output-tokens=2000
app.openai.timeout=30s

# --- API docs ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- Errors / actuator ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
